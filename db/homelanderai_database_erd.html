<style>
#erd {
  width: 100%;
  overflow-x: auto;
  background-color: var(--erd-bg, #0f172a);
  padding: 24px;
  border-radius: 8px;
}

@media (prefers-color-scheme: light) {
  #erd {
    --erd-bg: #ffffff;
  }
}

/* Base text visibility fixes across all ERD nodes */
#erd svg.erDiagram text,
#erd svg.erDiagram tspan {
  fill: var(--erd-text-color, #ffffff) !important;
  color: var(--erd-text-color, #ffffff) !important;
  font-weight: 500 !important;
  opacity: 1 !important;
}

@media (prefers-color-scheme: light) {
  #erd svg.erDiagram text,
  #erd svg.erDiagram tspan {
    --erd-text-color: #0f172a;
  }
}

/* Force dark row backgrounds for table attribute cells */
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even rect,
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram rect.attributeBoxBoxOdd,
#erd svg.erDiagram rect.attributeBoxBoxEven {
  fill: #1e293b !important;
  stroke: #334155 !important;
  stroke-width: 1px !important;
}

/* Entity Header Box styling */
#erd svg.erDiagram .entityBox,
#erd svg.erDiagram rect.entityBox {
  fill: #334155 !important;
  stroke: #64748b !important;
  stroke-width: 2px !important;
}

/* Relationship lines and labels */
#erd svg.erDiagram .divider path,
#erd svg.erDiagram .relationshipLine {
  stroke: #94a3b8 !important;
  stroke-width: 1.5px !important;
  stroke-opacity: 1 !important;
}

#erd svg.erDiagram .edgeLabel text,
#erd svg.erDiagram .edgeLabel tspan {
  fill: #f1f5f9 !important;
}

#erd svg.erDiagram .edgeLabel rect,
#erd svg.erDiagram .labelBkg {
  fill: #334155 !important;
  opacity: 0.95 !important;
}
</style>

<div id="erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

await document.fonts.ready;

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',

    lineColor: dark ? '#cbd5e1' : '#334155',
    textColor: dark ? '#ffffff' : '#0f172a',
    titleColor: dark ? '#ffffff' : '#0f172a',

    nodeBkg: dark ? '#1e293b' : '#ffffff',
    nodeBorder: dark ? '#64748b' : '#334155',

    labelColor: dark ? '#ffffff' : '#0f172a',
    labelBackground: dark ? '#334155' : '#e2e8f0',

    attributeBoxOddColor: dark ? '#1e293b' : '#ffffff',
    attributeBoxEvenColor: dark ? '#1e293b' : '#f8fafc'
  },
});

const src = `erDiagram
  TENANTS ||--o{ USERS : employs
  TENANTS ||--o{ APPLICANTS : has
  TENANTS ||--o{ API_KEYS : issues
  APPLICANTS ||--o{ APPLICATIONS : submits
  APPLICATIONS ||--o{ EVIDENCE_FILES : contains
  APPLICATIONS ||--o{ MODEL_RUNS : triggers
  MODEL_ARMS ||--o{ MODEL_RUNS : executes
  MODEL_RUNS ||--o{ SUB_SCORES : produces
  MODEL_RUNS ||--o{ EXPLANATION_ARTIFACTS : generates
  APPLICATIONS ||--o{ COMPOSITE_SCORES : scored_as
  APPLICATIONS ||--|| UNDERWRITER_DECISIONS : resolved_by
  USERS ||--o{ UNDERWRITER_DECISIONS : makes
  APPLICATIONS ||--o{ AUDIT_LOG : logs

  TENANTS {
    uuid id PK
    string name
    string subscription_tier
    timestamp created_at
  }
  USERS {
    uuid id PK
    uuid tenant_id FK
    string full_name
    string email
    string role
    string license_number
  }
  API_KEYS {
    uuid id PK
    uuid tenant_id FK
    string key_hash
    timestamp created_at
    timestamp revoked_at
  }
  APPLICANTS {
    uuid id PK
    uuid tenant_id FK
    string external_ref
    date date_of_birth
    string sex
  }
  APPLICATIONS {
    uuid id PK
    uuid tenant_id FK
    uuid applicant_id FK
    string status
    timestamp submitted_at
  }
  EVIDENCE_FILES {
    uuid id PK
    uuid application_id FK
    string file_type
    string storage_path
    timestamp uploaded_at
  }
  MODEL_ARMS {
    uuid id PK
    string name
    string arm_type
    string version
    string weight_hash
  }
  MODEL_RUNS {
    uuid id PK
    uuid application_id FK
    uuid model_arm_id FK
    string status
    timestamp started_at
    timestamp completed_at
  }
  SUB_SCORES {
    uuid id PK
    uuid model_run_id FK
    float raw_score
    float calibrated_score
  }
  EXPLANATION_ARTIFACTS {
    uuid id PK
    uuid model_run_id FK
    string artifact_type
    string storage_path
  }
  COMPOSITE_SCORES {
    uuid id PK
    uuid application_id FK
    int version
    float crs_value
    string tier
    timestamp computed_at
  }
  UNDERWRITER_DECISIONS {
    uuid id PK
    uuid application_id FK
    uuid underwriter_id FK
    string decision
    float final_premium
    timestamp decided_at
  }
  AUDIT_LOG {
    uuid id PK
    uuid application_id FK
    string event_type
    string payload_hash
    string prev_hash
    timestamp created_at
  }`;

const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

// Replace outer path boundaries with rounded rects
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const outerPath = node.querySelector('path:not([class])') || node.querySelector('path[d]');
  if (!outerPath) return;

  const d = outerPath.getAttribute('d');
  if (!d) return;

  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;

  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;

  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x);
  rect.setAttribute('y', y);
  rect.setAttribute('width', w);
  rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  rect.setAttribute('class', 'entityBox');

  outerPath.replaceWith(rect);
});

// Override inline style fills directly on SVG elements
document.querySelectorAll('#erd svg.erDiagram rect, #erd svg.erDiagram path').forEach(el => {
  if (el.classList.contains('entityBox')) return;
  if (el.parentElement?.classList.contains('row-rect-odd') || el.parentElement?.classList.contains('row-rect-even')) {
    el.setAttribute('fill', '#1e293b');
    el.style.fill = '#1e293b';
  }
});

document.querySelectorAll('#erd svg.erDiagram text, #erd svg.erDiagram tspan').forEach(el => {
  el.setAttribute('fill', '#ffffff');
  el.style.fill = '#ffffff';
});
</script>
