[project]
name = "homelander-api"
version = "0.1.0"
description = "HomelanderAI — underwriting decision-support API"
requires-python = ">=3.12,<3.13"

# ─────────────────────────────────────────────────────────────────────────────
# Core runtime. Everything here is imported by code that exists today.
#
# We do not pre-declare dependencies for planned work — add each one when the
# import that needs it is written:
#
#     uv add <package>        # then commit pyproject.toml *and* uv.lock together
#
# See docs/DESIGN_POLICY.md §4 and §8.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    # Web layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Persistence. asyncpg drives the app; Alembic runs sync through
    # psycopg2 (see alembic/env.py), so both drivers are needed.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    # Auth
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    # Evidence intake and the vision arm's preprocessing
    "numpy>=1.26",
    "pydicom>=3.0",
    "pillow>=11.0",
    "python-multipart>=0.0.32",
]

# ─────────────────────────────────────────────────────────────────────────────
# Optional extras. Skip these unless you are working on models.
#
#   uv sync --extra vision      the chest X-ray arm   (~2-3 GB, CPU wheels)
#
# The API runs without it. `app/arms/tb_xray.py` reports itself unavailable when
# torch is missing and the pipeline degrades instead of crashing, so anyone
# working on the dashboard or the database never downloads torch.
#
# Later arms (tabular: scikit-learn + xgboost + shap; clinical NLP: spaCy +
# scispaCy + transformers) get their own extras when their code is written —
# same rule as core deps, added at first import.
# ─────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
vision = [
    "torch>=2.5",
    "torchvision>=0.20",
    "torchxrayvision>=1.3",         # pretrained chest X-ray classifiers
    "grad-cam>=1.5",                # imports as `pytorch_grad_cam`
    "scikit-learn>=1.9.0",
]
# Deliberately not declared:
#
#   medspacy — its published sdist is broken (setup.py reads a
#   requirements/requirements.txt that isn't in the tarball), so it fails to
#   build metadata on every platform and takes the whole lockfile down with it.
#   negspacy covers NegEx negation, which is what Phase 3 needs first.
#
#   If you later want full ConText assertion detection (FAMILY_HISTORY and
#   HYPOTHETICAL, not just NEGATED), install it out-of-band from git into the
#   venv rather than adding it here:
#     uv pip install "medspacy @ git+https://github.com/medspacy/medspacy"
#
#   scispaCy NER models are not pip packages either — they install from URLs.
#   See README "Working on models".

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",                  # required by fastapi.testclient
]

# ─────────────────────────────────────────────────────────────────────────────
# CPU-only torch wheels. Far smaller than the default CUDA build and correct
# for the local-compute constraint.
#
# If you have an NVIDIA GPU and want CUDA, change the index URL below to
# https://download.pytorch.org/whl/cu124 and re-run `uv sync --extra vision`.
# ─────────────────────────────────────────────────────────────────────────────
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false                     # application, not a distributable library

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

# Alembic writes these; the column definitions are long by nature and
# reformatting them makes migrations harder to compare against the schema.
# alembic/env.py is hand-written and stays linted.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ASYNC",  # async correctness
]
ignore = [
    "B008",   # FastAPI Depends() in endpoint function arguments is standard design
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # torchxrayvision ships a pickled model built against an older torch; the
    # class definitions have moved since. Cosmetic, and it floods the output.
    "ignore::torch.serialization.SourceChangeWarning",
]
