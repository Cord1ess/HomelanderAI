<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HomelanderAI — Underwriting Console</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1419;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0f1419;
      }
      .boot-logo {
        width: 220px;
        height: 220px;
        max-width: 60vw;
        max-height: 60vh;
        border-radius: 50%;
        object-fit: contain;
        background: #fff;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
          0 2px 14px rgba(0, 0, 0, 0.4),
          inset 0 0 0 1px rgba(0, 0, 0, 0.04);
      }
      .boot-label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a929e;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(75, 153, 149, 0.25);
        border-top-color: #4b9995;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <img class="boot-logo" src="/favicon.svg" alt="HomelanderAI" />
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-label">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
