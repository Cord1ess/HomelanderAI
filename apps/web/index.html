<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HomelanderAI — Underwriting Console</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1419;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0f1419;
      }
      .boot-logo {
        width: 260px;
        height: auto;
        max-width: 70vw;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(75, 153, 149, 0.25);
        border-top-color: #4b9995;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <img class="boot-logo" src="/favicon.svg" alt="HomelanderAI" />
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
