# Infrastructure only. The API and web app run natively on your machine with
# hot reload — see README "Getting started".
#
# Not required for the Phase 0 scaffold; the dev server runs without Docker.
# You need this from Phase 1 onward, when the database lands.
#
#   npm run infra:up      start
#   npm run infra:ps      check
#   npm run infra:down    stop (keeps data)
#
# Background jobs run in-process via FastAPI BackgroundTasks with job state in
# Postgres, and uploaded evidence is written to ./data — so there is no broker
# or object store to run here. See docs/DESIGN_POLICY.md.

name: homelander

services:
  postgres:
    image: postgres:17-alpine
    container_name: homelander-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-homelander}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-homelander}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homelander} -d ${DB_NAME:-homelander}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
