# Infrastructure only. The API and web app run natively on your machine with
# hot reload — see README "Getting started".
#
# Not required for the Phase 0 scaffold; the dev server runs without Docker.
# You need this from Phase 1 onward, when the database lands.
#
#   npm run infra:up      start
#   npm run infra:ps      check
#   npm run infra:down    stop (keeps data)
#
# Background jobs run in-process via FastAPI BackgroundTasks with job state in
# Postgres, and uploaded evidence is written to ./data — so there is no broker
# or object store to run here. See docs/DESIGN_POLICY.md.
#
# Mirai, the mammogram reader, is the one model that runs here rather than in
# the API process: it pins Python 3.8 and torch 1.9, which cannot share a venv
# with the rest of the API. It runs on the CPU — no GPU, no cloud.

name: homelander

services:
  postgres:
    image: postgres:17-alpine
    container_name: homelander-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-homelander}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-homelander}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homelander} -d ${DB_NAME:-homelander}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Five-year breast-cancer risk from a four-view mammogram (Yala et al., Sci
  # Transl Med 2021; MIT licence, weights included). The maintained image from
  # the authors' group, pinned to the version verified against the project's
  # own published demo output — not `latest`, so the model cannot change
  # underneath a demonstration.
  #
  # CPU only. Measured on an Intel Core Ultra 5 125H: about 43 s per four-view
  # exam at 8 threads. 4 threads took 52 s and 16 took 49 s; the authors note
  # in their source that they have never seen a gain above 8.
  mirai:
    image: mitjclinic/mirai:v0.14.1
    container_name: homelander-mirai
    restart: unless-stopped
    environment:
      ARK_THREADS: "8"
    ports:
      - "${MIRAI_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # The mammogram heatmap: the same pinned Mirai image with one small server
  # added (Mirai/explain). Asked only for exams above the low tier, after the
  # risk is in, and its map is used only when its risk matches the reader's.
  # About 35 s per exam on the same CPU.
  mirai-explain:
    build: ./Mirai/explain
    image: homelander/mirai-explain:v0.14.1
    container_name: homelander-mirai-explain
    restart: unless-stopped
    ports:
      - "${MIRAI_EXPLAIN_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/info', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  postgres-data:
